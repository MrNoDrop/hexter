# Development profile - uses H2 in-memory database for local development
spring.datasource.url=jdbc:h2:mem:hexterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Enable H2 Console for debugging (optional)
spring.h2.console.enabled=false

# Mail configuration (disable for local dev)
spring.mail.host=localhost
spring.mail.port=1025

# Disable Spring Security for local development
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
